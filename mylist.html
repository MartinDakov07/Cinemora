  .list-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, 200px);
    gap: 25px;
    justify-content: center;
    margin-top: 25px;
  }

  .list-card {
    background: #1a1a1e;
    padding: 10px;
    border-radius: 10px;
    text-align: center;
    position: relative;
  }

  .list-card img {
    width: 100%;
    border-radius: 10px;
  }

  .trash {
  position: absolute;
  top: 8px;
  right: 10px;
  width: 20px;
  height: 20px;
  background: rgba(255, 70, 70, 0.12);
  border: 2px solid #ff4a4a;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: 0.25s;
}

.trash::before {
  content: "✕";
  color: #ff4a4a;
  font-weight: bold;
  font-size: 16px;
}

.trash:hover {
  background: #ff4a4a;
  border-color: #ff4a4a;
  transform: scale(1.15);
}

.trash:hover::before {
  color: white;
}

  .back-btn {
    padding: 10px 20px;
    background: #6c63ff;
    border: none;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    margin-bottom: 20px;
  }
  .logo{

    left:40px;
  }
  .mylist{
    margin-left:50px;
  }

      color: var(--accent, #6c63ff);
      text-decoration: none;
      margin-left:30px;
      font-weight: 600;
      transition: 0.3s;
    }
      .navbar .home:hover {
      color: var(--accent2, #a44cf5);
    }
    .nav-links a:hover,
    .nav-links .active {
      color: #6c63ff;
      text-shadow: 0 0 10px #6c63ff;
    }
</style>

<h2 class="mylist">My List</h2>

<script>
const searchDatabase = {

  "the incredibles": {page: "kids.html"},
  "moana": {page: "kids.html"},
  "deadpool and wolverine": {page: "movies.html"},
  "dune: part two": {page: "movies.html"},
  "kong vs godzilla": {page: "movies.html"},
  "oppenheimer": {page: "movies.html"},
  "avatar": {page: "movies.html"},
  "john wick 4": {page: "movies.html"},
  "interstellar": {page: "movies.html"},
  "transformers": {page: "movies.html"},
  "the batman": {page: "movies.html"},
  "mindhunter": { page: "series/mindhunter.html" },
  "true detective": { page: "series/truedetective.html" },
  "narcos": { page: "series/narcos.html" },
  "the wire": { page: "series/thewire.html" },
  "luther": { page: "series/luther.html" },
  "ozark": { page: "series/ozark.html" },
  "dark": { page: "series/dark.html" },
  "squid game": { page: "series/squidgame.html" },

  "the night agent": { page: "series/thenightagent.html" },

  "the fall": { page: "series/thefall.html" },
  "into the night": { page: "series/intothenight.html" },
  "jack ryan": { page: "series/jack-ryan.html" },
  "daredevil": { page: "series/daredevil.html" },
  "vikings": { page: "series/vikings.html" },
  "spartacus": { page: "series/spartacus.html" },
  "the last kingdom": { page: "series/the-last-kingdom.html" },
  "peaky blinders": { page: "series/peaky-blinders.html"},
  "clickbait": { page: "series/clickbait.html" },
  "house of the dragon": { page: "series/houseofthedragon.html" },

  "snowfall": { page: "series/snowfall.html" },

  "boardwalk empire": { page: "series/boardwalkempire.html" },  
  "westworld": { page: "series/westworld.html" },

  "1899": { page: "series/1899.html" },
  "the sinner": { page: "series/thesinner.html" },
  "the americans": { page: "series/theamericans.html" },
  "rome": { page: "series/rome.html" },
  "top boy": { page: "series/topboy.html" },
};


const searchInput = document.getElementById("searchInput");
const suggestionsBox = document.getElementById("suggestions");

// === AUTO-SUGGEST SYSTEM ===
searchInput.addEventListener("input", () => {
  const query = searchInput.value.toLowerCase().trim();
  suggestionsBox.innerHTML = "";

  if (query.length === 0) {
    suggestionsBox.style.display = "none";
    return;
  }

  // get titles from DB
  const titles = Object.keys(searchDatabase);

  // get matches
  const matches = titles.filter(t => t.includes(query));

  if (matches.length === 0) {
    suggestionsBox.style.display = "none";
    return;
  }

  suggestionsBox.style.display = "block";

  matches.forEach(title => {
    const div = document.createElement("div");
    div.textContent = title;

    div.onclick = () => {
      const itemPage = searchDatabase[title].page;
      window.location.href = itemPage;
    };

    suggestionsBox.appendChild(div);
  });
});
// === ENTER KEY SEARCH HANDLER ===
searchInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const query = searchInput.value.toLowerCase().trim();

    // If empty → do nothing
    if (!query) return;

    // If match exists → go to movie
    if (searchDatabase[query]) {
      window.location.href = searchDatabase[query].page;
      return;
    }

    // Otherwise → go to "Not Found" page
    window.location.href = "notfound.html?query=" + encodeURIComponent(query);
  }
});
// Load MyList
function loadMyList() {
  const list = localStorage.getItem("myList");
  if (!list) return [];

  try {
    const parsed = JSON.parse(list);

    // Remove items missing title or img
    return parsed.filter(item =>
      item &&
      typeof item.title === "string" &&
      item.title.trim() !== "" &&
      typeof item.img === "string" &&
      item.img.trim() !== ""
    );

  } catch (e) {
    // If JSON is corrupt, reset it
    localStorage.setItem("myList", "[]");
    return [];
  }
}


function saveMyList(list) {
  localStorage.setItem("myList", JSON.stringify(list));
}

// Render items
function displayList() {
  const container = document.getElementById("listContainer");
  const list = loadMyList();

  if (list.length === 0) {
    container.innerHTML = "<p>You still have 0 saves.</p>";
    return;
  }

  container.innerHTML = list.map(item => `
    <div class="list-card">
      <span class="trash" data-title="${item.title}"></span>
      <img src="${item.img}" alt="${item.title}">
      <h4>${item.title}</h4>
    </div>
  `).join("");

  document.querySelectorAll(".trash").forEach(btn => {
    btn.addEventListener("click", () => {
      const title = btn.dataset.title;
      removeItem(title);
    });
  });
}

// Remove an item
function removeItem(title) {
  let list = loadMyList();
  list = list.filter(item => item.title !== title);
  saveMyList(list);
  displayList();
}

displayList();
function goBack() {
  if (document.referrer) {
    history.back();
  } else {
    window.location.href = "index.html"; // fallback
  }
}

</script>
