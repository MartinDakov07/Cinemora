<!DOCTYPE html>
<html lang="en">
    <head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width,initial-scale=1.0">
       <title>Dexter - Cinemora</title>
       <link rel="stylesheet" href="..series-style.css">
    </head>
    <body>
      <header class="series-header">
        <h1>Dexter</h1>
        <p>2012-2019 • TV-MA • 46m</p>
  <a href="javascript:void(0)" class="home" onclick="goBack()">← Back</a>
      </header>

      <!-- Section for the image and trailer of the series -->
       <section class="series-hero">
        <!--The image for the serie-->
        <div class="poster">
            <img src="https://resizing.flixster.com/-XZAfHZM39UwaGJIFWKAE8fS0ak=/v3/t/assets/p7892422_b_v8_aa.jpg">
        </div>
        <!--And the trailer right next to it-->
        <div class="video-preview">
        <iframe
          src="https://www.youtube.com/embed/Gu1hhlcBTMQ?autoplay=1&mute=1&controls=0&disablekb=1&fs=0&rel=0&playsinline=1&loop=1&playlist=Gu1hhlcBTMQ"
          title="YouTube video player"
          frameborder="0"
          allow="autoplay; encrypted-media"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
        </div>
       </section>
         

       <!-- Tags for the serie -->
       <section class="tags">
        <span>Crime</span>
        <span>Thriller</span>
        <span>Drama</span>
       </section>

       <!--Description of the serie-->
        <section class="description">
            <p>
                A special detectiv,specialict in blood, who secretly punishesh all the crimes he counters with.
            </p>
        </section>
        
        <!--Episode ratings for the serie-->
        <section class="rating-section">
           <h2>Ratings by Episode</h2>
           <div class="season-row"><!--Season 1-->
            <div class="ep"></div> <!-- Episode 1 -->
           </div>
        </section>
        
        <!--Episode's rating legend-->
        <section class="rating-legend">
         <div><span class="legend-box bad"></span>Bad</div>
         <div><span class="legend-box mid"></span>Mid (6.0+)</div>
         <div><span class="legend-box good"></span>Good (8.0+)</div>
         <div><span class="legend-box awesome"></span>Awesome (8.6+)</div>
         <div><span class="legend-box cinema"></span>Absolute Cinema (9.6+)</div>
        </section>
        <script src="series-script.js"></script>
    </body>
</html>
